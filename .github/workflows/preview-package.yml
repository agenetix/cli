name: Preview package

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish-preview:
    name: Publish PR preview package
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    with:
      mode: preview

  remove-preview-tag:
    name: Remove PR preview dist-tag
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Remove dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          TAG="pr-${PR_NUMBER}"
          npm dist-tag rm "$PACKAGE_NAME" "$TAG" || true
